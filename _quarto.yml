  description: "Coding Provenance Workshop — a collaboration between the Provenance Lab and the Getty Provenance Index"
  site-url: "https://barbararomero.github.io/codingprovenanceworkshop/"
  page-navigation: false
  back-to-top-navigation: true
  search: false
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: coding-provenance.qmd
        text: Coding Provenance
      - href: team.qmd
        text: Team
      - href: alumni.qmd
        text: Alumni
      - text: Workshop Materials
        menu:
          - href: materials.qmd
            text: Overview
          - href: https://barbararomero.github.io/codingprovenance2/
            text: "Materials · Second Edition (2026)"
          - href: https://provenance-lab.github.io/coding_provenance/
